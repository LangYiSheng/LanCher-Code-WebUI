[project]
name = "lancher-agent-lab"
version = "0.1.0"
description = "独立的 LanCher Code Agent WebUI 实验工作台"
requires-python = ">=3.14"
dependencies = ["fastapi>=0.143,<1", "uvicorn>=0.54,<1", "lancher-code==0.1.0"]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
